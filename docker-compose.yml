name: blubird-shop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop # local demo credentials only
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Loopback only: lets the host run migrations/tests; never reachable from the network.
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shop -d shop']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://shop:shop@db:5432/shop
      # Demo operator token so a clean clone starts; override in any real deployment.
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-demo-operator-token-change-me-0123456789}
      # OpenAI-compatible model access (OpenRouter by default). Optional: the app runs without it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - '3000:3000'
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
